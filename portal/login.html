<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>We Clear Debt | Staff Login</title>

<link rel="stylesheet" href="css/login.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <img src="./assets/logo.PNG" class="logo" alt="We Clear Debt">

        <h2>Staff Portal</h2>

        <p id="loginSubtitle">Sign in to continue</p>

        <form id="loginForm">

            <label for="email">Email Address</label>
            <input
            type="email"
            id="email"
            placeholder="Email Address"
            required>

            <label for="password">Password</label>
            <input
            type="password"
            id="password"
            placeholder="Password"
            required>

            <button type="submit">

                Login

            </button>

        </form>

        <form id="passwordSetupForm" hidden>
            <label for="setupPassword">New Password</label>
            <input
                type="password"
                id="setupPassword"
                minlength="8"
                autocomplete="new-password"
                required>

            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                minlength="8"
                autocomplete="new-password"
                required>

            <button type="submit">Set Password</button>
        </form>

        <div id="message" role="status" aria-live="polite"></div>

    </div>

</div>

<script>
    window.portalAuthCallback = {
        flow: new URLSearchParams(window.location.hash.slice(1)).get("type"),
        error: new URLSearchParams(window.location.hash.slice(1)).get("error_description")
    };
</script>
<script src="js/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/auth.js"></script>

</body>

</html>
