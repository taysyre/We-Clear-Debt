<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Clear Debt CRM</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="legacy-form-page">
<main class="legacy-form-card">
    <h1>Client Management</h1>

<form id="clientForm">

    <input 
    type="text" 
    id="full_name" 
    placeholder="Full Name"
    required>


    <input 
    type="text" 
    id="phone" 
    placeholder="Phone Number">


    <input 
    type="email" 
    id="email" 
    placeholder="Email">


    <input 
    type="number" 
    id="debt_amount" 
    placeholder="Debt Amount">


    <button type="submit">
        Add Client
    </button>

</form>
</main>

<script src="js/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="js/supabase.js"></script>
</body>
</html>
